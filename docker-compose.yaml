services:

  # // frontend \\
  # frontend:
  #   build: frontend
  #   ports:
  #     - "${APP_PORT}:5000"
  #   environment:

  #     - REDIS_HOST=${REDIS_HOST}
  #     - REDIS_PORT=${REDIS_PORT}

  api-gateway:
    build: 
      context: backend
      args:
        - CURRENT_DIRECTORY=api-gateway
    ports:
      - "${API_GATEWAY_PORT-8000}:8000"
    networks:
      - backend_net
    env_file:
      - backend/api-gateway/.env
    environment:
      - TEMPLATE_SERVICE_ADDRESS=template-service:${SERVICE_PORT}
      - USERS_SERVICE_ADDRESS=users-service:${SERVICE_PORT}
      - FILES_SERVICE_ADDRESS=files-service:${SERVICE_PORT}
      - NOTIFICATIONS_SERVICE_ADDRESS=notifications-service:${SERVICE_PORT}
    healthcheck: { disable: true }

  template-service:
    build: 
      context: backend
      args:
        - CURRENT_DIRECTORY=template-service
    ports:
      - "${TEMPLATE_SERVICE_PORT-}:${SERVICE_PORT}"
    networks:
      - backend_net
    env_file:
      - backend/template-service/.env
    environment:
      - name=value

  users-service:
    build: 
      context: backend
      args:
        - CURRENT_DIRECTORY=users-service
    ports:
      - "${USERS_SERVICE_PORT-}:${SERVICE_PORT}"
    networks:
      - backend_net
      - users_net
      - mail_net
      - users_files_net
    env_file:
      - backend/users-service/.env
    environment:
      - MONGODB_ADDR=mongodb://${DB_ROOT_USERNAME}:${DB_ROOT_PASSWORD}@users-mongodb:27017
      - FILES_SERVICE_ADDRESS=files-service:${SERVICE_PORT}
    depends_on:
      users-mongodb:
        condition: service_healthy

  users-mongodb:
    image: mongodb/mongodb-atlas-local
    hostname: users-mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${DB_ROOT_USERNAME}
      - MONGODB_INITDB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ports:
      - "${USERS_DB_PORT-}:27017"
    networks:
      - users_net
    volumes:
      - ./db_init/users:/docker-entrypoint-initdb.d
      - users_db_data:/data/db
      - users_db_configdb:/data/configdb
      - users_db_mongot:/data/mongot
    attach: false

  files-service:
    build: 
      context: backend
      args:
        - CURRENT_DIRECTORY=files-service
    ports:
      - "${FILES_SERVICE_PORT-}:${SERVICE_PORT}"
    networks:
      - backend_net
      - files_net
      - users_files_net
    env_file:
      - backend/files-service/.env
    environment:
      - MONGODB_ADDR=mongodb://${DB_ROOT_USERNAME}:${DB_ROOT_PASSWORD}@files-mongodb:27017
    depends_on:
      files-mongodb:
        condition: service_healthy

  files-mongodb:
    image: mongodb/mongodb-atlas-local
    hostname: files-mongodb
    environment:
      - MONGODB_INITDB_ROOT_USERNAME=${DB_ROOT_USERNAME}
      - MONGODB_INITDB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    ports:
      - "${FILES_DB_PORT-}:27017"
    networks:
      - files_net
    volumes:
      - ./db_init/files:/docker-entrypoint-initdb.d
      - files_db_data:/data/db
      - files_db_configdb:/data/configdb
      - files_db_mongot:/data/mongot
    attach: false    
    
  notifications-service:
    build: 
      context: backend
      args:
        - CURRENT_DIRECTORY=notifications-service
    ports:
      - "${NOTIFICATIONS_SERVICE_PORT-}:${SERVICE_PORT}"
    networks:
      - backend_net
      - notifications_net
    env_file:
      - backend/notifications-service/.env
    environment:
      - CASSANDRA_ADDR=notifications-cassandra
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    depends_on:
      notifications-cassandra:
        condition: service_healthy
    
  notifications-cassandra:
    image: cassandra:6.0
    container_name: notification-cassandra
    ports:
      - "${NOTIFICATIONS_DB_PORT-}:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=notification-cluster
      - CASSANDRA_NUM_TOKENS=16
      # Pin gossip/internode traffic to loopback so it never depends on the container IP
      - CASSANDRA_LISTEN_ADDRESS=127.0.0.1
      - CASSANDRA_BROADCAST_ADDRESS=127.0.0.1
      - CASSANDRA_SEEDS=127.0.0.1
      # Client connections still accepted from other containers
      # - CASSANDRA_RPC_ADDRESS=0.0.0.0
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=200M
      - JVM_EXTRA_OPTS=-Dcassandra.load_ring_state=false -Dcassandra.skip_wait_for_gossip_to_settle=0 -Dcassandra.initial_token=0
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select release_version from system.local'"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 15s
    volumes:
      - notification_service_cass_store:/var/lib/cassandra/data
    networks:
      - notifications_net
    attach: false
  
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025" # SMTP server port
      - "8025:8025" # Web UI port
    networks:
      - mail_net

volumes:
  users_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/users/data
  users_db_configdb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/users/configdb
  users_db_mongot:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/users/mongot

  notification_service_cass_store:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/notifications
  files_db_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/files/data
  files_db_configdb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/files/configdb
  files_db_mongot:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/db_data/files/mongot

networks:
  backend_net:
  users_net:
  notifications_net:
  mail_net:
  files_net:
  users_files_net:
