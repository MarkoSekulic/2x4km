syntax = "proto3";

option go_package = "proto/files";

import "google/api/annotations.proto";

service FilesService {

    //Folders CRUD
  rpc FolderCreate(FolderCreateRequest) returns (FolderCreateResonse){
    option (google.api.http) = {
      post: "/folders/create"
      body: "*"
    };
  }

  rpc FolderRead(FolderReadRequest) returns (Empty){
    option (google.api.http) = {
      post: "/folders/{folderId}"
      body: "*"
    };
  }

  rpc FolderUpdate(FolderUpdateRequest) returns (FolderUpdateResponse){
    option (google.api.http) = {
      post: "/folders/update"
      body: "*"
    };
  }

  rpc FolderDelete(FolderDeleteRequest) returns (FolderDeleteResponse){
    option (google.api.http) = {
      post: "/folders/delete"
      body: "*"
    };
  }

  // rpc AddFolder(AddFolderRequest) returns (Empty){
  //   option (google.api.http) = {
  //     post: "/folders/add-folder"
  //     body: "*"
  //   };
  // }

  // rpc AddFile(AddFileRequest) returns (Empty){
  //   option (google.api.http) = {
  //     post: "/folders/add-file"
  //     body: "*"
  //   };
  // }

}

