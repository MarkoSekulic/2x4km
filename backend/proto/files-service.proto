syntax = "proto3";

option go_package = "proto/files";

import "google/api/annotations.proto";

service FilesService {
  rpc FolderCreate(FolderCreateRequest) returns (Empty){
    option (google.api.http) = {
      post: "/folders/create"
      body: "*"
    };
  }

  rpc FolderUpdate(FolderUpdateRequest) returns (Empty){
    option (google.api.http) = {
      post: "/folders/update"
      body: "*"
    };
  }

  rpc FolderDelete(FolderDeleteRequest) returns (Empty){
    option (google.api.http) = {
      post: "/folders/delete"
      body: "*"
    };
  }

   rpc FileCreate(FileCreateRequest) returns (Empty){
    option (google.api.http) = {
      post: "/files/create"
      body: "*"
    };
  }

  rpc FileUpdate(FileUpdateRequest) returns (Empty){
    option (google.api.http) = {
      post: "/files/update"
      body: "*"
    };
  }

  rpc FileDelete(FileDeleteRequest) returns (Empty){
    option (google.api.http) = {
      post: "/files/delete"
      body: "*"
    };
  }

}

message Empty{

}

message FolderDeleteRequest {
}

message FolderUpdateRequest {
  string name = 2;
}

message FolderCreateRequest {
  string name = 2;
  string parent_id = 3;
  string user_id = 4;
}

message FileDeleteRequest {
}

message FileUpdateRequest {
  string name = 2;
}

message FileCreateRequest {
  string name = 2;
  string parent_id = 3;
  string user_id = 4;
}
